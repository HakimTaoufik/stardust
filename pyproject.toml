[project]
name = "stardust"
version = "0.1"
description = " simple and configurable config management package for all ML needs "
readme = "README.md"
authors = [
    { name = "HakimTaoufik", email = "al-hakim.taoufik@polytechnique.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
stardust = "stardust:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]
