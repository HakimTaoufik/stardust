name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Check tag matches pyproject version
        run: |
          python - <<'PY'
          import tomllib
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")

          with open("pyproject.toml", "rb") as f:
              actual = tomllib.load(f)["project"]["version"]

          if actual != expected:
              raise SystemExit(f"Tag {tag} does not match pyproject version {actual}")
          PY

      - name: Build package
        run: uv build

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import stardust; print(stardust.__all__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
